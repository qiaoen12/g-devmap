name: devmap-docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  devmap-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check DevMap docs and Issue protocol
        run: |
          set -eu
          workflow=.github/workflows/devmap-docs.yml
          test -s README.md
          test -s AGENTS.md
          test -s .github/ISSUE_TEMPLATE/task.md
          test -s devmap/SKILL.md
          test -s devmap/templates/map.md
          test -s devmap/scripts/devmap_facts.py
          grep -Fq 'devmap-docs' AGENTS.md
          # Line-based guards cover this workflow's current layout, not arbitrary YAML.
          grep -Fqx '  pull_request:' "$workflow"
          grep -Fqx '  push:' "$workflow"
          grep -Fqx '    branches: [main]' "$workflow"
          grep -Fqx '  devmap-docs:' "$workflow"
          grep -Fqx '    timeout-minutes: 10' "$workflow"
          grep -Fqx '          fetch-depth: 1' "$workflow"
          grep -Fqx '          persist-credentials: false' "$workflow"
          # This guard supports this file's unquoted workflow keys and uses entries, not arbitrary YAML syntax.
          if grep -Eq '^[[:space:]]*pull_request_target:' "$workflow"; then
            printf '%s\n' 'pull_request_target is not allowed.' >&2
            exit 1
          fi
          if ! awk '
            /^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*/ {
              value = $0
              sub(/^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*/, "", value)
              sub(/[[:space:]]+#.*/, "", value)
              if (value ~ /^\.\//) next
              at = index(value, "@")
              if (at == 0) {
                invalid = 1
              } else {
                ref = substr(value, at + 1)
                if (length(ref) != 40 || ref ~ /[^[:xdigit:]]/) invalid = 1
                else actions++
              }
            }
            END { exit !(actions > 0 && !invalid) }
          ' "$workflow"; then
            printf '%s\n' 'External Actions must be pinned to a full commit SHA.' >&2
            exit 1
          fi
          if ! grep -Eq '^      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1([[:space:]]+#.*)?$' "$workflow"; then
            printf '%s\n' 'actions/checkout must use the approved v7.0.1 commit.' >&2
            exit 1
          fi
          if ! awk '
            /^[[:space:]]*permissions[[:space:]]*:/ {
              permission_keys++
              if ($0 != "permissions:") invalid = 1
              in_permissions = 1
              next
            }
            in_permissions && /^[^[:space:]#]/ {
              in_permissions = 0
            }
            in_permissions && /^[[:space:]]*contents[[:space:]]*:[[:space:]]*read[[:space:]]*$/ {
              contents++
              next
            }
            in_permissions && /^[[:space:]]*[[:alnum:]_-]+[[:space:]]*:/ {
              invalid = 1
            }
            END { exit !(permission_keys == 1 && contents == 1 && !invalid) }
          ' "$workflow"; then
            printf '%s\n' 'Workflow permissions must be limited to contents: read.' >&2
            exit 1
          fi
      - name: Run facts script unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check document length limits
        run: |
          # Limit unit: Unicode characters = Python len() of the whole UTF-8-decoded file, frontmatter included.
          python3 - <<'PY'
          import sys
          limits = {"devmap/SKILL.md": 4000, "devmap/templates/map.md": 2000}
          failed = False
          for path, limit in limits.items():
              with open(path, encoding="utf-8") as handle:
                  count = len(handle.read())
              print(f"{path}: {count}/{limit} characters")
              failed = failed or count > limit
          sys.exit(1 if failed else 0)
          PY
